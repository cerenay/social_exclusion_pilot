{% extends "global/Page.html" %}

{% block title %}
    Painting Preference
{% endblock %}

{% block content %}

<p><strong>Please select your preferred painting from each pair below.</strong></p>

<form method="post">

    {% for i in range(1, 6) %}
        <div style="margin-bottom: 30px;">
            <p><strong>Pair {{ i }}</strong></p>
            <div style="display: flex; justify-content: space-around; align-items: center;">
                <label>
                    <img src="/static/painting_choice/pair{{ i }}_A.jpg" width="250"><br>
                    <input type="radio" name="painting_choice_{{ i }}" value="A" required> A
                </label>
                <label>
                    <img src="/static/painting_choice/pair{{ i }}_B.jpg" width="250"><br>
                    <input type="radio" name="painting_choice_{{ i }}" value="B" required> B
                </label>
            </div>
        </div>
    {% endfor %}

    <button class="btn btn-primary">Next</button>
</form>

{% endblock %}
