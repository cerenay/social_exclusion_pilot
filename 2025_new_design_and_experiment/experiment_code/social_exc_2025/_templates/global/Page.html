{{ extends "otree/Page.html" }}
{{ load otree }}

{{ block global_styles }}
<style>
/* ── CSS Variables ── */
:root {
  --accent:       #6366F1;
  --accent-dark:  #4F46E5;
  --accent-light: rgba(99,102,241,0.12);
  --bg:           #F4F4F5;
  --card-bg:      #FFFFFF;
  --border:       #E4E4E7;
  --text-main:    #18181B;
  --text-sub:     #3F3F46;
  --text-muted:   #71717A;
  --green:        #16A34A;
  --red:          #DC2626;
}

/* ── Base ── */
*, *::before, *::after { box-sizing: border-box; }

body {
  background: var(--bg) !important;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
  color: var(--text-main) !important;
  font-size: 15px !important;
  line-height: 1.7 !important;
}

/* ── Container ── */
.container {
  max-width: 760px !important;
  padding-top: 0 !important;
}

/* ── Hide Bootstrap navbar (oTree adds one) ── */
.navbar { display: none !important; }

/* ── Page title (oTree renders block title inside <h2>) ── */
h2 {
  font-size: 1.45rem !important;
  font-weight: 600 !important;
  color: var(--text-main) !important;
  text-align: center !important;
  padding: 30px 0 22px !important;
  margin: 0 0 28px 0 !important;
  border-bottom: 1px solid var(--border) !important;
  background: var(--card-bg) !important;
  letter-spacing: -0.01em !important;
}

/* ── Content card ── */
.content-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 32px 36px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.05);
  margin-bottom: 40px;
}
.content-card p { color: var(--text-sub); margin-bottom: 14px; }
.content-card ul, .content-card ol { color: var(--text-sub); padding-left: 20px; margin-bottom: 14px; }
.content-card li { margin-bottom: 6px; }

/* ── Section block (scenarios, question groups) ── */
.section-block {
  background: #FAFAFA;
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  border-radius: 8px;
  padding: 20px 24px;
  margin: 20px 0;
}
.section-block p { color: var(--text-sub); margin-bottom: 10px; }
.section-title {
  font-size: 0.78rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--accent);
  margin-bottom: 12px;
}

/* ── Horizontal rule ── */
hr {
  border: none !important;
  border-top: 1px solid var(--border) !important;
  margin: 22px 0 !important;
}

/* ── Next / submit button ── */
.btn-primary,
button.btn-primary,
input[type="submit"].btn-primary,
.otree-btn-next {
  background: var(--accent) !important;
  border-color: var(--accent) !important;
  border-radius: 8px !important;
  padding: 10px 28px !important;
  font-size: 0.95rem !important;
  font-weight: 500 !important;
  letter-spacing: 0.01em !important;
  transition: background 0.15s, box-shadow 0.15s !important;
  margin-top: 24px !important;
}
.btn-primary:hover, .otree-btn-next:hover {
  background: var(--accent-dark) !important;
  border-color: var(--accent-dark) !important;
  box-shadow: 0 2px 8px rgba(99,102,241,0.3) !important;
}
.btn-primary:disabled, .otree-btn-next:disabled {
  background: #A1A1AA !important;
  border-color: #A1A1AA !important;
  cursor: not-allowed !important;
  box-shadow: none !important;
  opacity: 1 !important;
}

/* ── Text & number inputs ── */
input[type="number"],
input[type="text"],
input[type="email"],
textarea,
select {
  border: 1px solid #D4D4D8 !important;
  border-radius: 6px !important;
  padding: 8px 12px !important;
  font-size: 0.95rem !important;
  color: var(--text-main) !important;
  background: #fff !important;
  transition: border-color 0.15s, box-shadow 0.15s !important;
  outline: none !important;
}
input[type="number"]:focus,
input[type="text"]:focus,
textarea:focus,
select:focus {
  border-color: var(--accent) !important;
  box-shadow: 0 0 0 3px var(--accent-light) !important;
}

/* ── Radio & checkbox accent colour ── */
input[type="radio"],
input[type="checkbox"] {
  accent-color: var(--accent) !important;
  width: 15px !important;
  height: 15px !important;
  cursor: pointer !important;
}

/* ── Radio / checkbox list items (oTree wraps in <ul>) ── */
.controls ul { list-style: none !important; padding-left: 0 !important; }
.controls ul li { margin-bottom: 4px !important; }
.controls ul li label {
  display: inline-flex !important;
  align-items: center !important;
  gap: 8px !important;
  padding: 6px 10px !important;
  border-radius: 6px !important;
  cursor: pointer !important;
  transition: background 0.1s !important;
  color: var(--text-sub) !important;
}
.controls ul li label:hover { background: #F4F4F5 !important; }

/* ── Range slider ── */
input[type="range"] {
  -webkit-appearance: none !important;
  appearance: none !important;
  height: 4px !important;
  border-radius: 4px !important;
  background: #D4D4D8 !important;
  outline: none !important;
  border: none !important;
  vertical-align: middle !important;
  padding: 0 !important;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none !important;
  width: 18px !important;
  height: 18px !important;
  border-radius: 50% !important;
  background: var(--accent) !important;
  cursor: pointer !important;
  box-shadow: 0 1px 4px rgba(99,102,241,0.35) !important;
}
input[type="range"]::-moz-range-thumb {
  width: 18px !important;
  height: 18px !important;
  border-radius: 50% !important;
  background: var(--accent) !important;
  cursor: pointer !important;
  border: none !important;
}

/* ── Likert table ── */
.likert-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
.likert-table th {
  font-size: 0.74rem;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  padding: 8px 6px;
  text-align: center;
  border-bottom: 2px solid var(--border);
}
.likert-table th:first-child { text-align: left; min-width: 260px; }
.likert-table td {
  padding: 10px 6px;
  text-align: center;
  border-bottom: 1px solid #F4F4F5;
  color: var(--text-sub);
  font-size: 0.9rem;
}
.likert-table td:first-child { text-align: left; padding-left: 0; }
.likert-table tr:hover td { background: #FAFAFA; }

/* ── EMU sum box ── */
.sum-box {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: #F4F4F5;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 16px;
  font-size: 0.9rem;
  color: var(--text-sub);
  margin-top: 12px;
}

/* ── Group colour helpers ── */
.tag-klee      { color: var(--green); font-weight: 600; }
.tag-kandinsky { color: var(--red);   font-weight: 600; }

/* ── Slider value display ── */
.slider-value {
  display: inline-block;
  min-width: 28px;
  font-weight: 600;
  color: var(--accent);
  margin-left: 10px;
  font-size: 0.95rem;
}

/* ── Error messages ── */
.alert-danger, .errorlist {
  border-radius: 8px !important;
  font-size: 0.88rem !important;
}
ul.errorlist { color: var(--red); list-style: none; padding-left: 0; }
</style>
{{ endblock }}

{{ block global_scripts }}{{ endblock }}
