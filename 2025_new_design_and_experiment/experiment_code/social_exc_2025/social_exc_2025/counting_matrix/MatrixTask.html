{{ block title }}
    Estimation Task
{{ endblock }}

{{ block content }}

<p>Please use the sliders below to make your estimates.
Once you move a slider, you won’t be able to change it again.</p>

<p><strong>Valid answer range:</strong> {{ min_val }}–{{ max_val }}</p>

<form method="post">
    {% for i in range(1, 6) %}
        <div style="margin-bottom: 25px;">
            <label for="slider{{ i }}">Slider {{ i }}:</label><br>
            <input type="range"
                   name="slider{{ i }}"
                   id="slider{{ i }}"
                   min="0"
                   max="100"
                   value="0"
                   style="width: 400px;"
                   oninput="updateSlider(this, 'value{{ i }}')"
                   onchange="lockSlider(this)">
            <span id="value{{ i }}">100</span>
        </div>
    {% endfor %}

    <button class="btn btn-primary">Next</button>
</form>

<script>
    function updateSlider(slider, valueId) {
        document.getElementById(valueId).textContent = slider.value;
    }

    function lockSlider(slider) {
        // Disable the current slider ONLY after user finishes interaction
        slider.disabled = true;
    }
</script>

{{ endblock }}
